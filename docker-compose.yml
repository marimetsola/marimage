services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ${IMAGE_DIR}:/usr/share/nginx/html/i:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://imagehost:${POSTGRES_PASSWORD}@db:5432/imagehost
      REGISTER_ENABLED: ${REGISTER_ENABLED}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_DIR: /app/images
      THUMBNAIL_DIR: /app/thumbnails
    volumes:
      - ${IMAGE_DIR}:/app/images    
      - ${THUMBNAIL_DIR}:/app/thumbnails

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: imagehost
      POSTGRES_USER: imagehost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
