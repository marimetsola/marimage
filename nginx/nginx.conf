server {
    listen 80;

    location /i/ {
        alias /usr/share/nginx/html/i/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
