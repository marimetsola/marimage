server {
    listen 80;

    location /i/ {
        alias /usr/share/nginx/html/i/;
    }


    location /t/ {
        alias /usr/share/nginx/html/t/;
    }

    location /api/upload {
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
