# Preserve the original protocol provided by a reverse proxy.
# Fall back to the current connection's scheme if the header is empty.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limit the maximum size of uploaded request bodies.
    client_max_body_size 10m;

    # Serve the frontend and support client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Serve uploaded original images.
    location /i/ {
        alias /usr/share/nginx/html/i/;
    }

    # Serve generated image thumbnails.
    location /t/ {
        alias /usr/share/nginx/html/t/;
    }

    # Disable interactive API documentation in production.
    location = /docs {
        return 404;
    }

    # Disable direct access to the OpenAPI schema.
    location = /openapi.json {
        return 404;
    }
}
